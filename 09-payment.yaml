- name: configure payment server
  hosts: payment
  become: yes
  tasks:
  - name: install python 3.14
    package:
      name:
      - python3.14
      - python3.14-pip
      state: present

  - name: create roboshop system user
    user:
      name: roboshop
      system: true
      home: /app
      shell: /sbin/nologin
      create_home: false
      comment: "roboshop system user"

  - name: remove app directory
    file:
      path: /app
      state: absent

  - name: delete payment.zip in tmp directory
    file:
      path: /tmp/payment.zip
      state: absent

  - name: create app directory
    file:
      path: /app
      state: directory

  - name: download payment
    get_url:
      url: "{{ ARTIFACT_URL }}/payment-v4.zip"
      dest: /tmp/payment.zip

  - name: unzip payment
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes

  - name: install dependencies in a virtual environment
    pip:
      requirements: /app/requirements.txt
      virtualenv: /app/.venv
      virtualenv_command: python3.14 -m venv

  - name: copy payment service
    template:
      src: payment.service.j2
      dest: /etc/systemd/system/payment.service

  - name: daemon reload
    systemd_service:
      daemon_reload: true

  - name: enable and restart payment
    service:
      name: payment
      state: restarted
      enabled: yes
